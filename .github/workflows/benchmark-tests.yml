name: Benchmark tests

on:
  push:
    paths:
      - "ocean_bench/**"
      - "tests/**"
      - "experiments/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark-tests.yml"
  pull_request:
    paths:
      - "ocean_bench/**"
      - "tests/**"
      - "experiments/**"
      - "pyproject.toml"
      - ".github/workflows/benchmark-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test report generation
        run: |
          PYTHONPATH=. python -m ocean_bench.runner experiments/fixtures/smoke-runs.jsonl \
            --json-out /tmp/smoke-results.json \
            --markdown-out /tmp/smoke-results.md
          python -c "import json; r=json.load(open('/tmp/smoke-results.json')); assert r['run_count'] == 2; assert not r['guardrail']['any_safety_violations']"
